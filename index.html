<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Auto Garage | Thrissur</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Fallback system fonts matching Tailwind's sans */
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVG Icon Components (Replacing lucide-react for a single-file setup) ---
        const Phone = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        );
        const MapPin = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        );
        const Clock = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );
        const User = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );
        const MessageCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        );
        const ChevronDown = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );
        const ArrowRight = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );

        function App() {
            const [scrolled, setScrolled] = useState(false);

            // Handle scroll effect for the header
            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen bg-[#0a0a0a] text-white">
                    
                    {/* 1. STICKY HEADER */}
                    <header 
                        className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 border-b ${
                            scrolled ? 'bg-black/80 backdrop-blur-md border-white/10 py-3' : 'bg-transparent border-transparent py-4'
                        } px-4 sm:px-8 flex justify-between items-center`}
                    >
                        <div className="flex flex-col">
                            <span className="text-red-600 font-black tracking-wider text-sm">GRAND</span>
                            <span className="text-white font-bold text-xs tracking-widest">AUTO GARAGE</span>
                        </div>
                        
                        <a href="tel:9747730400" className="flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md font-bold text-sm transition-colors shadow-lg shadow-red-600/20">
                            <Phone size={14} className="text-white" />
                            <span>97477 30400</span>
                        </a>
                    </header>

                    {/* 2. HERO SECTION (FIRST VIEW) */}
                    <section className="relative min-h-[100dvh] flex flex-col justify-center px-6 sm:px-12 pt-20 pb-10 overflow-hidden">
                        {/* Background Image with Overlay */}
                        <div className="absolute inset-0 z-0">
                            <img 
                                src="https://images.unsplash.com/photo-1558981403-c5f9899a28bc?q=80&w=1080&auto=format&fit=crop" 
                                alt="Motorcycle Background" 
                                className="w-full h-full object-cover opacity-30 mix-blend-luminosity"
                            />
                            {/* Gradient to fade into the next section */}
                            <div className="absolute inset-0 bg-gradient-to-b from-[#0a0a0a]/40 via-[#0a0a0a]/60 to-[#0a0a0a]"></div>
                        </div>

                        {/* Hero Content */}
                        <div className="relative z-10 flex flex-col items-start mt-10 max-w-4xl mx-auto w-full">
                            {/* Badge */}
                            <div className="inline-flex items-center gap-2 bg-red-950/50 border border-red-500/30 backdrop-blur-sm px-3 py-1.5 rounded-full mb-6">
                                <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                                <span className="text-[10px] sm:text-xs font-semibold tracking-widest text-red-200 uppercase">
                                    Thrissur · Patturaikkal · Since Decades
                                </span>
                            </div>

                            {/* Main Typography */}
                            <h1 className="text-5xl sm:text-7xl font-black uppercase tracking-tighter leading-[0.9] mb-4">
                                <span className="block text-white drop-shadow-md">Grand Auto</span>
                                <span className="block text-red-600 drop-shadow-md">Garage</span>
                            </h1>
                            
                            <div className="flex items-center gap-4 mb-6 w-full max-w-sm">
                                <div className="h-[1px] flex-1 bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>
                                <p className="text-xs font-bold tracking-[0.2em] text-gray-400 uppercase whitespace-nowrap">
                                    Used Two-Wheelers
                                </p>
                                <div className="h-[1px] flex-1 bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>
                            </div>

                            <h2 className="text-xl sm:text-3xl font-bold text-white mb-10 leading-snug max-w-xl">
                                BUY · SELL · EXCHANGE <br/>
                                <span className="text-gray-400 font-medium">USED BIKES & SCOOTERS IN</span>
                                <span className="text-red-500 ml-2">THRISSUR</span>
                            </h2>

                            {/* Primary Call to Actions */}
                            <div className="flex flex-col sm:flex-row w-full max-w-md gap-3 mt-4">
                                <a href="#details" className="w-full sm:w-auto flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-xl font-bold text-sm transition-all transform hover:scale-[1.02] active:scale-95 shadow-xl shadow-red-600/20">
                                    VISIT SHOWROOM
                                    <ArrowRight size={16} />
                                </a>
                                <a href="https://wa.me/919747730400" target="_blank" rel="noreferrer" className="w-full sm:w-auto flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 backdrop-blur-sm text-white px-6 py-4 rounded-xl font-bold text-sm transition-all transform hover:scale-[1.02] active:scale-95">
                                    <MessageCircle size={16} />
                                    WhatsApp Us
                                </a>
                            </div>
                        </div>

                        {/* Scroll Indicator */}
                        <a href="#details" className="absolute bottom-8 left-0 right-0 flex justify-center z-10 animate-bounce cursor-pointer">
                            <div className="flex flex-col items-center gap-2 opacity-50 hover:opacity-100 transition-opacity">
                                <span className="text-[10px] uppercase tracking-widest font-semibold">View Details</span>
                                <ChevronDown size={20} />
                            </div>
                        </a>
                    </section>


                    {/* 3. DETAILS SECTION (SECOND SCROLL) */}
                    <section id="details" className="relative z-20 bg-[#0a0a0a] px-4 py-20 sm:px-6 max-w-4xl mx-auto scroll-mt-10">
                        
                        {/* Descriptive Text Cards */}
                        <div className="space-y-6 mb-12">
                            {/* Malayalam Block - Emphasized with red border */}
                            <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-red-950/20 to-black border border-white/5 p-6 sm:p-8 shadow-2xl">
                                <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-red-600"></div>
                                <p className="text-lg sm:text-2xl text-gray-200 leading-relaxed font-medium">
                                    പഴയ ടൂവീലർ വാഹനങ്ങൾ വാങ്ങുവാനും വിൽക്കുവാനും സമീപിക്കുക. എക്സ്ചേഞ്ച് സൗകര്യം ലഭ്യമാണ്.
                                </p>
                            </div>

                            {/* English Block */}
                            <div className="rounded-2xl bg-white/[0.02] border border-white/5 p-6 sm:p-8">
                                <p className="text-gray-400 leading-relaxed text-sm sm:text-lg">
                                    Thrissur's trusted <strong className="text-white font-semibold">second-hand two-wheeler dealer</strong> — verified used motorcycles & scooters of every leading brand, with full RTO transfer support and instant spot cash for your old bike.
                                </p>
                            </div>
                        </div>

                        {/* Contact Information Grid */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            
                            {/* Proprietor */}
                            <div className="flex flex-col justify-center p-6 rounded-2xl bg-[#111] border border-white/5 hover:border-white/10 transition-colors">
                                <div className="flex items-center gap-3 mb-2 opacity-60">
                                    <User size={16} className="text-red-500" />
                                    <span className="text-xs font-bold tracking-widest uppercase">Proprietor</span>
                                </div>
                                <p className="text-xl sm:text-2xl font-bold text-white">Romeo Jose</p>
                            </div>

                            {/* Call Direct */}
                            <a href="tel:9747730400" className="flex flex-col justify-center p-6 rounded-2xl bg-[#111] border border-white/5 hover:border-white/10 transition-colors group cursor-pointer block">
                                <div className="flex items-center gap-3 mb-2 opacity-60">
                                    <Phone size={16} className="text-red-500" />
                                    <span className="text-xs font-bold tracking-widest uppercase">Call Direct</span>
                                </div>
                                <p className="text-xl sm:text-2xl font-bold text-white group-hover:text-red-500 transition-colors">97477 30400</p>
                            </a>

                            {/* Location */}
                            <div className="flex flex-col justify-center p-6 rounded-2xl bg-[#111] border border-white/5 hover:border-white/10 transition-colors">
                                <div className="flex items-center gap-3 mb-2 opacity-60">
                                    <MapPin size={16} className="text-red-500" />
                                    <span className="text-xs font-bold tracking-widest uppercase">Location</span>
                                </div>
                                <p className="text-xl sm:text-2xl font-bold text-white mb-1">Patturaikkal</p>
                                <p className="text-sm text-gray-500">Thrissur · 680022</p>
                            </div>

                            {/* Hours */}
                            <div className="flex flex-col justify-center p-6 rounded-2xl bg-[#111] border border-white/5 hover:border-white/10 transition-colors">
                                <div className="flex items-center gap-3 mb-2 opacity-60">
                                    <Clock size={16} className="text-red-500" />
                                    <span className="text-xs font-bold tracking-widest uppercase">Open</span>
                                </div>
                                <p className="text-xl sm:text-2xl font-bold text-red-500 mb-1">Mon - Sat</p>
                                <p className="text-sm text-gray-500">9 AM – 7 PM</p>
                            </div>

                        </div>

                    </section>

                    {/* Floating WhatsApp Button (Bottom Right) */}
                    <a 
                        href="https://wa.me/919747730400" 
                        target="_blank" 
                        rel="noreferrer"
                        className="fixed bottom-6 right-6 z-50 bg-[#25D366] text-white p-4 rounded-full shadow-xl shadow-green-500/20 hover:scale-110 transition-transform flex items-center justify-center"
                        aria-label="Chat on WhatsApp"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c-.003 1.396.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.005-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
                        </svg>
                    </a>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
